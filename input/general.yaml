units:
  phi_unit: &phi_unit "GHz min"
  fnu_unit: &fnu_unit "mJy"
  nu_unit: &nu_unit "GHz"

model_parameters:
  phi_th:
    values:
      start: -2.0
      stop: 3.0
      num: 256
      scale: "log"
    unit: *phi_unit
  theta0:
    start: 3.0
    stop: 60.0
    num: 256
    scale: "linear"
  shock:
    common:
      eps_th: 0.4
      eps_b: 1.0e-02
      molecular_weight:
        mu: 0.5
        mu_e: 1.00
    powerlaw:
      p_index: 3.0
      f_e: 1.0e-02
  distance:
    value: 5.0
    unit: "kpc"
  synchrotron_model: total

candidate_models_selection:
  observation_frequencies:
    values:
      - 5.5
      - 9.0
    unit: *nu_unit

model_lightcurves:
  xm:
    start: 1.0e-02
    stop: 1.0e+04
    num: 256
    scale: log
  time:
    values:
      start:  1.0e-02
      stop:   1.0e+04 
      num: 256
      scale: "log"
    unit: "s"

chi2:
  timewindow:
    min: 0.0
    max: 16.0
    unit: "min"

burster_property:
  burster_name: "4U 1728-34"
  mdot_acc:
    value: 4.2e+23 
    unit: "g yr-1"
  t_acc:
    value: 3.0
    unit: "hr"
  eps_nuc:
    value: 6.75e+18
    unit: "erg g-1"

switches:
  distribuion_factors: false  # f_factor and g_factor

workflows:
  powerlaw_sensitivity:
    p_indices:
      start: 2.01
      stop: 3.01
      num: 16
      scale: linear
    f_es:
      start: 1.0e-03
      stop: 1.0e+03
      num: 16
      scale: log
