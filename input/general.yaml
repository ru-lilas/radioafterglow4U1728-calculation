units:
  phi_unit: &phi_unit "GHz min"
  fnu_unit: &fnu_unit "mJy"
  nu_unit: &nu_unit "GHz"

model_parameters:
  phi_th:
    values:
      start: 0.0
      stop: 2.0
      num: 256
      scale: "log"
    unit: *phi_unit
  theta0:
    start: 3.0
    stop: 8.0
    num: 256
    scale: "linear"
  eps_th: 0.4
  eps_b: 1.0e-02
  mu: 0.5
  mu_e: 1.00
  distance:
    value: 5.0
    unit: "kpc"

candidate_models_selection:
  observation_frequencies:
    values:
      - 5.5
      - 9.0
    unit: *nu_unit

chi2fitting:
  free_parameters:
    - a_wind
    - beta_sh
  sampling:
    nu: &nu
      value: 9.0
      unit: *nu_unit
    timewindow:
      min: 0.0
      max: 16.0
      unit: "min"
  model:
    time:
      values:
        start: 0.0
        stop: 4.0
        num: 256
        scale: "log"
      unit: "s"
    fnu_unit: *fnu_unit
    nu: *nu

burster_property:
  burster_name: "4U 1728-34"
  mdot_acc:
    value: 4.2e+23 
    unit: "g yr-1"
  t_acc:
    value: 3.0
    unit: "hr"
  eps_nuc:
    value: 6.75e+18
    unit: "erg g-1"
