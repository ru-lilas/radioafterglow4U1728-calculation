physical_parameters:
  a_wind:
    values:
      start: 4.0
      stop: 8.0
      num: 256
      scale: "log"
    unit: "g cm-1"
  beta_sh:
    start: -1.0
    stop: -0.3
    num: 256
    scale: "log"
  eps_th: 0.4
  eps_b: 1.0e-02
  mu: 0.5
  mu_e: 1.00
  distance:
    value: 5.0
    unit: "kpc"

chi2fitting:
  free_parameters:
    - a_wind
    - beta_sh
  obs_sampling:
    nu: &nu
      value: 9.0
      unit: "GHz"
    timewindow:
      min: 0.0
      max: 16.0
      unit: "min"
  model_lc:
    time:
      value_arr:
        start: 0.0
        stop: 4.0
        num: 256
        scale: "log"
      unit: "s"
    fnu_unit: "mJy"
    nu: *nu
