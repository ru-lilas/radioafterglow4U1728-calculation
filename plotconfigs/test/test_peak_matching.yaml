TicksConfigure: &TicksConfigure_tmp
  xlim: [1.0e+00,1.0e+04]
  ylim: [1.0e-10,1.0e+10]
  xscale: "log"
  yscale: "log"
  fontsize: 16
LabelConfigure: &LabelConfigure_tmp
  xlabel: '$x_{\mathrm{M}}$'
  ylabel: '$L_{\nu}~/~L_{\Theta}$'
  fontsize: 24
inner_annotation: &inner_annotation_tmp
  xi_peak:
    prefix: '$x_{\mathrm{M}}(\tau=1)=$'
    fmt: ".2e"
vlines: &xi_peak_vline
  xm_est:
    label: '$x_{\mathrm{M,est}}$'
    ls: '-.'
    color: "#000000"
annotations: &annotations_tmp
  t:
    unit: 't_unit'
    prefix: '$t=$'
  phi_theta:
    unit: 'phi_unit'
    prefix: '$\phi_{\Theta}=$'
  l_theta:
    unit: 'l_unit'
    prefix: '$L_{\Theta}=$'

plot_lnudimless_xi:
  TicksConfigure:
    <<: *TicksConfigure_tmp

  LabelConfigure:
    <<: *LabelConfigure_tmp

  vlines:
    <<: *xi_peak_vline

  hlines:
    lnu_est_dimless:
      label: '$L_{\nu,\mathrm{est}}~/~L_{\Theta}$'
      ls: '--'
      color: "#000000"
  annotations:
    <<: *annotations_tmp

  x_name: "xi"
  y_name: "lnu_th_dimless"

  peak_errors:
    x:
      denom_key: "xm_est"
      numer_key: "xm_peak"
      prefix: '$1.0 - x_{\mathrm{M,peak}}~/~x_{\mathrm{M,est}}=$'
      fmt: '.2e'
    y:
      denom_key: "lnu_est_dimless"
      numer_key: "lnu_peak_dimless"
      prefix: '$1.0 - L_{\nu,\mathrm{peak}}~/~L_{\nu,\mathrm{est}}=$'
      fmt: '.2e'

ln_tau:
  TicksConfigure:
    <<: *TicksConfigure_tmp
    ylim: [-20.0,10.0]
    yscale: "linear"

  LabelConfigure:
    <<: *LabelConfigure_tmp
    ylabel: '$\ln\tau(x_{\mathrm{M}})$'

  hlines:
    solution:
      value: 0.0
      label: '$\ln\tau = 0$'
      ls: '--'
      color: "#000000"
  vlines:
    <<: *xi_peak_vline

  annotations:
    <<: *annotations_tmp

  x_name: "xi"
  y_name: "ln_tau"

f_esc:
  TicksConfigure:
    <<: *TicksConfigure_tmp
  LabelConfigure:
    <<: *LabelConfigure_tmp
    ylabel: '$1-\exp(-\tau(x_{\mathrm{M}}))$'
  hlines:
    solution:
      value: 0.632120
      label: '$f_{\mathrm{esc}}= 1-1/e$'
      ls: '--'
      color: "#000000"
  vlines:
    <<: *xi_peak_vline
  annotations:
    <<: *annotations_tmp
  x_name: "xi"
  y_name: "f_esc"
