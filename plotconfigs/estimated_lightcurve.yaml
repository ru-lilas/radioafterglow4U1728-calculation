figsize: [16,12]
TicksConfigure: &TicksConfigure_tmp
  xlim: [-10.0,30.0]
  ylim: [0.5,1.5]
  xscale: "linear"
  yscale: "linear"
  fontsize: 24
LabelConfigure: &LabelConfigure_tmp
  xlabel: 'time since X-ray burst [min]'
  ylabel: 'net specific flux [mJy]'
  fontsize: 24
nu_values:
  - 5.5
  - 9.0
nu_unit: "GHz"
t_unit: "min"
fnu_unit: "mJy"
calculation:
  linestyle: "-"
  linewidth: 2
  color: "#000000"
  label: ""
observation_scatter:
  size: 30
  color: "#005AFF"
  marker: "o"
annotation:
  config:
    use: True
    fontsize: 16
    pos: [1.00,1.01]
    ha: "right"
    va: "bottom"
  elements:
    eps_B:
      prefix: '$\varepsilon_{\mathrm{B}}$'
      fmt: '.1e'
    eps_th:
      prefix: '$\varepsilon_{\mathrm{th}}$'
      fmt: '.1e'
    mu:
      prefix: '$\mu$'
      fmt: '.2f'
    mu_e:
      prefix: '$\mu_e$'
      fmt: '.2f'
hlines:
  f9_per:
    color: "#000000"
    ls: "--"
    label: ""
    # label_conf:
    #   prefix: '$F_{\nu,\mathrm{per}}$'
    #   fmt: '.2f'
    #   unit: "mJy"
