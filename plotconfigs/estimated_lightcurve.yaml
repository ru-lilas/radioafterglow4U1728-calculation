styles:
  model_binned: 
    color: "#000000"
    linewidth: 2.0
    linestyle: "-"
    alpha: null
    zorder: 1.0
  observation:
    marker: "o"
    markersize: 6.0
    markerfacecolor : "#000000"
    markeredgecolor : "#000000"
    markeredgewidth: 1.0
    ecolor: "#000000"
    elinewidth: 1.0
    capsize: 1.0
    capthick: 1.0
    linestyle: "none"
    alpha: null
    zorder: 0.0
layout:
  figure:
    figsize: [16,12]
    dpi: 100
  axes:
    x:
      scale: "linear"
      limits: [-10.0,30.0]
      label:
        prefix: 'Time Since the X-ray Burst'
        unit: "min"
        fontsize: 32
    y:
      scale: "linear"
      limits: [0.0,2.0]
      label:
        prefix: 'Net Flux Density'
        unit: "mJy"
        fontsize: 32
    ticks:
      labelsize: 32
      direction: "in"
      major_length: 10.0
      minor_length: 8.0
      width: 1.0
      pad: 10.0
