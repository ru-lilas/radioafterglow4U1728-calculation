layout:
  figure:
    figsize:
    - 12
    - 8
    dpi: 150
    layout_engine: constrained
  subplots:
    nrows: 1
    ncols: 1
    sharex: false
    sharey: false
    hide_shared_labels: false
  axes:
    x:
      scale: log
      limits: null
      label:
        prefix: $\phi_{\mathrm{th}}$
        unit: GHz min
        fontsize: 20
    y:
      scale: linear
      limits: null
      label:
        prefix: $\theta_0$
        unit: ''
        fontsize: 20
    ticks:
      labelsize: 16
      direction: in
      major_length: 8.0
      minor_length: 4.0
      width: 1.0
      pad: 6.0
metadata:
  fontsize: 16
  items:
    eps_b:
      show: true
      unit: ''
      label_format:
        prefix: \varepsilon_{\mathrm{B}}
        fmt: .1e
        unit: ''
    eps_th:
      show: true
      unit: ''
      label_format:
        prefix: \varepsilon_{\mathrm{th}}
        fmt: .2f
        unit: ''
    mu_e_mu:
      show: true
      unit: ''
      label_format:
        prefix: \mu_e/\mu
        fmt: .2f
        unit: ''
    f_e:
      show: true
      unit: ''
      label_format:
        prefix: f_e
        fmt: .1e
        unit: ''
    p_index:
      show: true
      unit: ''
      label_format:
        prefix: p
        fmt: .2f
        unit: ''
    distance:
      show: true
      unit: kpc
      label_format:
        prefix: D
        fmt: .1f
        unit: \mathrm{kpc}
components:
  ratio_map:
    type: colormap
    style:
      cmap: RdBu_r
      shading: auto
      vmin: null
      vmax: null
      norm:
        type: centered
        vcenter: 0.0
      colorbar:
        show: true
        pad: 0.02
        fraction: 0.05
        tick_labelsize: 14
        label:
          prefix: $\log_{10}(x_{\mathrm{M,peak}}/x_{\mathrm{M,cutoff}})$
          unit: ''
          fontsize: 18
