figsize: [12,12]

x: &Axis_tmp
  lim: [1.0e+04,1.0e+07]
  scale: "log"
  ticksize: 16
  data: 
    value: "a_wind"
    unit: "a_wind_unit"
  label:
    prefix: '$A_{\mathrm{w}}$'
    unit: "g cm-1"
    fontsize: 24
y:
  <<: *Axis_tmp
  lim: [1.0e-01,5.0e-01]
  scale: "log"
  data: 
    value: "beta_sh"
    unit: null
  label:
    prefix: '$\beta_{\mathrm{sh}}$'
    unit: null
    fontsize: 24

colormap: 
  name: "cividis_r"
  over: null
  under: "lightgray"
  
contourf:
  zdata:
    value: "tau_theta"
    unit: null
  extend: "min"
  levels:
    scale: "log"
    arr:
      start: 0
      stop: 20
      num: 64
cbar:
  label:
    prefix: '$\tau_{\Theta}$'
    unit: null
    fontsize: 24
  ticksize: 16
