layout:
  figure:
    figsize: [12,12]
    dpi: 100
  axes:
    x:
      scale: "log"
      limits: [1.0e+00,1.0e+02]
      label:
        prefix: '$\nu t_{\mathrm{peak}}$'
        unit: "GHz min"
        fontsize: 32
    y:
      scale: "log"
      limits: [1.0e-01,1.0e+01]
      label:
        prefix: '$F_{\nu,\mathrm{net,peak}}$'
        unit: "mJy"
        fontsize: 32
    ticks:
      labelsize: 32
      direction: "in"
      major_length: 10.0
      minor_length: 8.0
      width: 1.0
      pad: 10.0
contours:
  a_wind: &ContourConfigure_tmp
    unit: "g cm-1"
    style: &ContourStyle_tmp
      colors: "#84919B"
      linestyles: "-"
    levels:
      start: null
      stop: null
      num: 5
    label:
      inline: true
      inline_spacing: 5
      fontsize: 16
    label_format:
      prefix: 'A_{\mathrm{w}}'
      fmt: ".1e"
      unit: '\mathrm{g\,cm^{-1}}'
  beta_sh:
    style:
      colors: "#84919B"
      linestyles: "--"
    levels:
      start: null
      stop: null
      num: 5
    label:
      inline: true
      inline_spacing: 5
      fontsize: 16
    label_format:
      prefix: '\beta_{\mathrm{sh}}'
      fmt: ".2f"
      unit: ''
    unit: ""
styles:
  obs_range:
    facecolor: "#C8C8CB"
    edgecolor: "#000000"
    linewidth: 1.0
    alpha: 0.8
    zorder: 1
  obs_center:
    marker: "o"
    markersize: 64.0
    markerfacecolor : "#000000"
    markeredgecolor : "#000000"
    markeredgewidth: 1.0
    ecolor: "#000000"
    elinewidth: 1.0
    capsize: 1.0
    capthick: 1.0
    linestyle: "none"
    alpha: null
    zorder: 1.0
  thin_boundary: 
    color: "#000000"
    linewidth: 4.0
    linestyle: "-"
    alpha: null
    zorder: 2.0
  relativistic_boundary: 
    color: "#000000"
    linewidth: 4.0
    linestyle: "-"
    alpha: null
    zorder: 2.0
metadata:
  fontsize: 16
  eps_b:
    show: true
    prefix: '\varepsilon_{\mathrm{B}}'
    fmt: '.1e'
    unit: ""
  eps_th:
    show: true
    prefix: '\varepsilon_{\mathrm{th}}'
    fmt: '.2f'
    unit: ""
  mue_mu:
    show: true
    prefix: '\mu_{\mathrm{e}}/\mu'
    fmt: '.1f'
    unit: ""
  distance:
    show: true
    prefix: 'D'
    fmt: '.1f'
    unit: "\mathrm{kpc}"
