layout:
  figure:
    figsize: [12,12]
    dpi: 100
  axes:
    x:
      scale: "log"
      limits: [1.0e+00,1.0e+02]
      label:
        prefix: '$\nu t_{\mathrm{peak}}$'
        unit: "GHz min"
        fontsize: 32
    y:
      scale: "log"
      limits: [1.0e-01,1.0e+01]
      label:
        prefix: '$F_{\nu,\mathrm{net,peak}}$'
        unit: "mJy"
        fontsize: 32
    ticks:
      labelsize: 32
      direction: "in"
      major_length: 10.0
      minor_length: 8.0
      width: 1.0
      pad: 10.0
contours:
  a_wind: &ContourConfigure_tmp
    style: &ContourStyle_tmp
      colors: "#000000"
      linestyles: "-"
    levels:
      start: 1.0e+05
      stop: 1.0e+08
      num: 5
    label:
      fontsize: 16
      fmt: "%.1e"
  beta_sh:
    style:
      colors: "#000000"
      linestyles: "--"
    levels:
      start: null
      stop: null
      num: 10
    label:
      fontsize: 16
      fmt: "%.1f"
  phi_th:
    style:
      colors: "#000000"
      linestyles: "-"
    levels:
      start: 1.0e-01
      stop: 1.0e+01
      num: 10
    label:
      fontsize: 16
      fmt: "%.1f"
  theta0:
    style:
      colors: "#000000"
      linestyles: "--"
    levels:
      start: 3.0
      stop: 10.0
      num: 7.0
    label:
      fontsize: 16
      fmt: "%.1f"
styles:
  obs_range:
    facecolor: "#C8C8CB"
    edgecolor: "#000000"
    linewidth: 1.0
    alpha: 0.8
    zorder: 1
  obs_center:
    marker: "o"
    markersize: 64.0
    markerfacecolor : "#000000"
    markeredgecolor : "#000000"
    markeredgewidth: 1.0
    ecolor: "#000000"
    elinewidth: 1.0
    capsize: 1.0
    capthick: 1.0
    linestyle: "none"
    alpha: null
    zorder: 1.0
metadata:
  eps_b:
    show: true
    prefix: '\varepsilon_{\mathrm{B}}'
    fmt: '.1e'
    unit: null
  eps_th:
    show: true
    prefix: '\varepsilon_{\mathrm{th}}'
    fmt: '.2f'
    unit: null
  distance:
    show: true
    prefix: 'D'
    fmt: '.1f'
    unit: "kpc"
  mu:
    show: true
    prefix: '\mu'
    fmt: '.1f'
    unit: null
  mu_e:
    show: true
    prefix: '\mu_e'
    fmt: '.1f'
    unit: null
