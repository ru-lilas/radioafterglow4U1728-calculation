layout:
  figure:
    figsize: [12,12]
    dpi: 100
  axes:
    x:
      scale: "log"
      limits: [1.0e+00,1.0e+02]
      label:
        prefix: '$\nu t_{\mathrm{peak}}$'
        unit: "GHz min"
        fontsize: 32
    y:
      scale: "log"
      limits: [1.0e-01,1.0e+01]
      label:
        prefix: '$F_{\nu,\mathrm{net,peak}}$'
        unit: "mJy"
        fontsize: 32
    ticks:
      labelsize: 32
      direction: "in"
      major_length: 10.0
      minor_length: 8.0
      width: 1.0
      pad: 10.0
contours:
  a_wind: &ContourConfigure_tmp
    style: &ContourStyle_tmp
      colors: "#000000"
      linestyles: "-"
    levels:
      start: null
      stop: null
      num: 10
  beta_sh:
    style:
      colors: "#000000"
      linestyles: "--"
    levels:
      start: null
      stop: null
      num: 10
styles:
  obs_range:
    facecolor: "#C8C8CB"
    edgecolor: "#000000"
    linewidth: 1.0
    alpha: 0.8
    zorder: 1
  obs_center:
    marker: "o"
    markersize: 64.0
    markerfacecolor : "#000000"
    markeredgecolor : "#000000"
    markeredgewidth: 1.0
    ecolor: "#000000"
    elinewidth: 1.0
    capsize: 1.0
    capthick: 1.0
    linestyle: "none"
    alpha: null
    zorder: 1.0
