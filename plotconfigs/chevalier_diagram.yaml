layout:
  figure:
    figsize: [16,9]
    dpi: 100
  axes:
    x:
      scale: "linear"
      limits: [-10.0,34.0]
      label:
        prefix: 'Time Since the X-ray Burst'
        unit: "min"
        fontsize: 32
    y:
      scale: "linear"
      limits: [0.5,1.5]
      label:
        prefix: 'Radio Flux Density'
        unit: "mJy"
        fontsize: 32
    ticks:
      labelsize: 32
      direction: "in"
      major_length: 10.0
      minor_length: 8.0
      width: 1.0
      pad: 10.0
contours:
  a_wind: &ContourConfigure_tmp
    style: &ContourStyle_tmp
      colors: "#000000"
      linestyles: "-"
    levels:
      start: null
      stop: null
      num: 10
  beta_sh:
    style:
      colors: "#000000"
      linestyles: "--"
    levels:
      start: null
      stop: null
      num: 10
