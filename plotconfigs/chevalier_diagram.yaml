layout:
  figure:
    figsize: [12,12]
    dpi: 100
    layout_engine: constrained
  subplots:
    nrows: 1
    ncols: 1
    sharex: false
    sharey: false
    hide_shared_labels: false
  axes:
    x:
      scale: "log"
      limits: [1.0e+00,1.0e+02]
      label:
        prefix: '$\nu t_{\mathrm{peak}}$'
        unit: "GHz min"
        fontsize: 32
    y:
      scale: "log"
      limits: [1.0e-01,1.0e+01]
      label:
        prefix: '$F_{\nu,\mathrm{net,peak}}$'
        unit: "mJy"
        fontsize: 32
    ticks:
      labelsize: 32
      direction: "in"
      major_length: 10.0
      minor_length: 8.0
      width: 1.0
      pad: 10.0
metadata:
  fontsize: 18
  items:
    eps_b:
      show: true
      unit: ""
      label_format:
        prefix: '\varepsilon_{\mathrm{B}}'
        fmt: '.1e'
        unit: ""
    eps_th:
      show: true
      unit: ""
      label_format:
        prefix: '\varepsilon_{\mathrm{th}}'
        fmt: '.2f'
        unit: ""
    distance:
      show: true
      unit: "kpc"
      label_format:
        prefix: 'D'
        fmt: '.1f'
        unit: '\mathrm{kpc}'
    mu_e_mu:
      show: true
      unit: ""
      label_format:
        prefix: '\mu_{\mathrm{e}}/\mu'
        fmt: '.1f'
        unit: ""
    p_index: 
      show: true
      unit: ""
      label_format:
        prefix: 'p'
        fmt: '.2f'
        unit: ''
    f_e: 
      show: true
      unit: ""
      label_format:
        prefix: 'f_{\mathrm{e}}'
        fmt: '.1e'
        unit: ''
components:
  a_wind:
    type: contour
    legend: false
    style: &ContourStyle_tmp
      unit: "g cm-1"
      lines:
        colors: "#84919B"
        linestyles: "-"
      levels:
        start: null
        stop: null
        num: null
        scale: "log"
        values:
          - 1.0e+04
          - 1.0e+05
          - 1.0e+06
          - 1.0e+07
          - 1.0e+08
          - 1.0e+09
      label: &ContourLabel_tmp
        inline: true
        inline_spacing: 5
        fontsize: 16
      label_format:
        prefix: 'A_{\mathrm{w}}'
        fmt: ".0e"
        unit: '\mathrm{g\,cm^{-1}}'
  beta_sh:
    type: contour
    legend: false
    style:
      unit: ""
      lines:
        colors: "#84919B"
        linestyles: "--"
      levels:
        start: null
        stop: null
        num: null
        scale: "linear"
        values:
          - 0.20
          - 0.30
          - 0.40
          - 0.50
          - 0.60
      label:
        <<: *ContourLabel_tmp
      label_format:
        prefix: '\beta_{\mathrm{sh}}'
        fmt: ".2f"
        unit: ''
  obs_ranges:
    type: rectangle
    legend: true
    style:
      facecolors: 
        - "#FFCABF"
        - "#BFE4FF"
      edgecolor: "#000000"
      linewidth: 1.0
      alpha: 0.8
      zorder: 1
      hatches:
        - "/"
        - null
    label_format:
      prefix: ''
      fmt: '.1f'
      unit: '\mathrm{GHz}'
      suffix: '(\mathrm{Russell}+24)'
  non_relativistic_boundary: &BoundaryComponent_tmp
    type: line
    legend: false
    style: &BoundaryStyle_tmp
      colors:
        - "#000000"
      linewidth: 4.0
      linestyle: "-"
      alpha: null
      zorder: 2.0
  ultra_relativistic_boundary:
    <<: *BoundaryComponent_tmp
  non_relativistic_boundary_label: &BoundaryLabelComponent_tmp
    type: text
    legend: false
    style:
      color: "#000000"
      fontsize: 36
      ha: left
      va: top
  ultra_relativistic_boundary_label:
    <<: *BoundaryLabelComponent_tmp
    style:
      color: "#000000"
      fontsize: 36
      ha: right
      va: bottom
  legend:
    fontsize: 24
    loc: "upper left"
