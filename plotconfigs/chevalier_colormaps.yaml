layout:
  figure:
    figsize: [24,24]
    dpi: 100
    layout_engine: constrained
  subplots:
    nrows: 2
    ncols: 3
    sharex: true
    sharey: true
    hide_shared_labels: true
  axes:
    x:
      scale: "log"
      limits: [1.0e+00,1.0e+02]
      label:
        prefix: '$\nu t_{\mathrm{peak}}$'
        unit: "GHz min"
        fontsize: 32
    y:
      scale: "log"
      limits: [1.0e-01,1.0e+01]
      label:
        prefix: '$F_{\nu,\mathrm{net,peak}}$'
        unit: "mJy"
        fontsize: 32
    ticks:
      labelsize: 32
      direction: "in"
      major_length: 10.0
      minor_length: 8.0
      width: 1.0
      pad: 10.0
styles:
  obs_ranges:
    facecolors: 
      - "#FFCABF"
      - "#BFE4FF"
    edgecolor: "#000000"
    linewidth: 1.0
    alpha: 0.8
    zorder: 1
    hatches:
      - "/"
      - null
  obs_center:
    marker: "o"
    markersize: 64.0
    markerfacecolor : "#000000"
    markeredgecolor : "#000000"
    markeredgewidth: 1.0
    ecolor: "#000000"
    elinewidth: 1.0
    capsize: 1.0
    capthick: 1.0
    linestyle: "none"
    alpha: null
    zorder: 1.0
  thin_boundary: 
    color: "#000000"
    linewidth: 4.0
    linestyle: "-"
    alpha: null
    zorder: 2.0
  relativistic_boundary: 
    color: "#000000"
    linewidth: 4.0
    linestyle: "-"
    alpha: null
    zorder: 2.0
colormaps:
  theta:
    cmap: cividis
    shading: auto
    vmin: null
    vmax: null
    norm:
      type: linear
    colorbar: &colorbar_tmp
      show: true
      pad: 0.01
      tick_labelsize: 12
      fraction: 0.5
      label:
        prefix: '$\Theta$'
        unit: ""
        fontsize: 32
  tau_th:
    cmap: cividis_r
    shading: auto
    vmin: null
    vmax: null
    norm:
      type: log
    colorbar:
      <<: *colorbar_tmp
      label:
        prefix: '$\tau_{\Theta}$'
        unit: ""
        fontsize: 32
  phi_th:
    cmap: viridis
    shading: auto
    vmin: null
    vmax: null
    norm:
      type: log
    colorbar:
      <<: *colorbar_tmp
      label:
        prefix: '$\phi_{\Theta}$'
        unit: "GHz min"
        fontsize: 32
  lnu_th:
    cmap: viridis
    shading: auto
    vmin: null
    vmax: null
    norm:
      type: log
    colorbar:
      <<: *colorbar_tmp
      label:
        prefix: '$L_{\nu,\Theta}$'
        unit: "erg s-1 Hz-1"
        fontsize: 32
  beta_sh:
    cmap: cividis
    shading: auto
    vmin: null
    vmax: null
    norm:
      type: linear
    colorbar:
      <<: *colorbar_tmp
      label: 
        prefix: '$\beta_{\mathrm{sh}}=v_{\mathrm{sh}}/c$'
        unit: ""
        fontsize: 32
  a_syn:
    cmap: cividis
    shading: auto
    vmin: null
    vmax: null
    norm:
      type: log
    colorbar:
      <<: *colorbar_tmp
      label:
        prefix: '$A_{\mathrm{syn}}$'
        unit: "g cm-1"
        fontsize: 32
  a_wind:
    cmap: cividis
    shading: auto
    vmin: null
    vmax: null
    norm:
      type: log
    colorbar:
      <<: *colorbar_tmp
      label: 
        prefix: '$A_{\mathrm{w}}$'
        unit: "g cm-1"
        fontsize: 32
metadata:
  fontsize: 24
  eps_b:
    show: true
    unit: ""
    label_format:
      prefix: '\varepsilon_{\mathrm{B}}'
      fmt: '.1e'
      unit: ""
  eps_th:
    show: true
    unit: ""
    label_format:
      prefix: '\varepsilon_{\mathrm{th}}'
      fmt: '.2f'
      unit: ""
  mue_mu:
    show: true
    unit: ""
    label_format:
      prefix: '\mu_{\mathrm{e}}/\mu'
      fmt: '.1f'
      unit: ""
  distance:
    show: true
    unit: "kpc"
    label_format:
      prefix: 'D'
      fmt: '.1f'
      unit: '\mathrm{kpc}'
legend:
  fontsize: 24
  loc: "upper left"
