layout:
  figure:
    figsize: [48,24]
    dpi: 100
    layout_engine: constrained
  subplots:
    nrows: 4
    ncols: 6
    sharex: col
    sharey: row
    hide_shared_labels: true
  axes:
    x:
      - &time_axis
        scale: log
        limits: [1.0e-1,1.0e+03]
        label:
          prefix: '$x_\mathrm{M}$'
          unit: &x_unit ""
          fontsize: 32
      - *time_axis
      - *time_axis
      - *time_axis
      - *time_axis
      - *time_axis
    y:
      - &flux_axis
        scale: log
        limits: [1.0e-3,1.0e+02]
        label:
          prefix: '$\zeta$'
          unit: &y_unit ""
          fontsize: 32
      - &eta_axis
        scale: log
        limits: [1.0e-3,1.0e+02]
        label:
          prefix: '$\eta$'
          unit: *y_unit
          fontsize: 32
      - &source_function_axis
        scale: log
        limits: [1.0e-2,1.0e+06]
        label:
          prefix: '$\zeta/\eta$'
          unit: *y_unit
          fontsize: 32
      - &lambda_axis
        scale: log
        limits: [1.0e-02,1.0e+06]
        label:
          prefix: '$\Lambda_\mathrm{syn}$'
          unit: *y_unit
          fontsize: 32
    ticks:
      labelsize: 32
      direction: "in"
      major_length: 10.0
      minor_length: 8.0
      width: 1.0
      pad: 10.0
metadata:
  fontsize: 18
  items:
    eps_b:
      show: true
      unit: ""
      label_format: &LabelFormatTmp
        prefix: '\varepsilon_{\mathrm{B}}'
        fmt: '.1e'
        unit: ""
        suffix: ""
        show_equals: true
    eps_th:
      show: true
      unit: ""
      label_format:
        <<: *LabelFormatTmp
        prefix: '\varepsilon_{\mathrm{th}}'
        fmt: '.2f'
        unit: ""
    distance:
      show: true
      unit: "kpc"
      label_format:
        <<: *LabelFormatTmp
        prefix: 'D'
        fmt: '.1f'
        unit: '\mathrm{kpc}'
    mu_e_mu:
      show: true
      unit: ""
      label_format:
        <<: *LabelFormatTmp
        prefix: '\mu_{\mathrm{e}}/\mu'
        fmt: '.1f'
        unit: ""
    a_wind:
      show: true
      unit: "g cm-1"
      label_format:
        <<: *LabelFormatTmp
        prefix: 'A_{\mathrm{w}}'
        fmt: '.1e'
        unit: '\mathrm{g/cm}'
    beta_sh: 
      show: true
      unit: ""
      label_format:
        <<: *LabelFormatTmp
        prefix: '\beta_{\mathrm{sh}}'
        fmt: '.2f'
        unit: ''
    p_index: 
      show: true
      unit: ""
      label_format:
        <<: *LabelFormatTmp
        prefix: 'p'
        fmt: '.2f'
        unit: ''
    f_e: 
      show: true
      unit: ""
      label_format:
        <<: *LabelFormatTmp
        prefix: 'f_{\mathrm{e}}'
        fmt: '.1e'
        unit: ''
    chi_squared: 
      show: true
      unit: ""
      label_format:
        <<: *LabelFormatTmp
        prefix: '\chi^2'
        fmt: '.1f'
        unit: ''
    nu: 
      show: true
      unit: "GHz"
      label_format:
        prefix: '\nu'
        fmt: '.1f'
        unit: '\mathrm{GHz}'
components:
  thermal:
    type: line
    style:
      colors: ["#000000"]
      linewidth: 2.0
      linestyle: "-"
  powerlaw:
    type: line
    style:
      colors: ["#000000"]
      linewidth: 2.0
      linestyle: "-"
  total:
    type: line
    style:
      colors: ["#000000"]
      linewidth: 2.0
      linestyle: "-"
  p_index_colorbar:
    type: colorbar
    style:
      show: true
      pad: 0.02
      fraction: 0.05
      tick_labelsize: 20
      label: &ColorbarLabel
        prefix: "$p$"
        unit: ""
        fontsize: 32
  f_e_colorbar:
    type: colorbar
    style:
      show: true
      pad: 0.02
      fraction: 0.05
      tick_labelsize: 20
      label:
        <<: *ColorbarLabel
        prefix: "$f_e$"
