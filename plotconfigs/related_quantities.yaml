layout:
  figure:
    figsize: [12,12]
    dpi: 50
    layout_engine: constrained
  subplots:
    nrows: 3
    ncols: 3
    sharex: true
    sharey: true
    hide_shared_labels: true
  axes:
    x:
      scale: "log"
      limits: [1.0e-01,1.0e+02]
      label:
        prefix: '$\Theta$'
        unit: ""
        fontsize: 32
    y:
      scale: "log"
      limits: [1.0e+00,1.0e+02]
      label:
        prefix: '$f_{\Theta}$'
        unit: ""
        fontsize: 32
    ticks:
      labelsize: 24
      direction: "in"
      major_length: 10.0
      minor_length: 8.0
      width: 1.0
      pad: 10.0
style:
  color: "#000000"
  linewidth: 2.0
  linestyle: "-"
  alpha: null
  zorder: 1.0
